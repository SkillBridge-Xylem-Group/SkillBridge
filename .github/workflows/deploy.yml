name: Deployment

on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set deploy path
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=/var/www/skillbridge/app" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "path=/var/www/skillbridge-sandbox/app" >> "$GITHUB_OUTPUT"
            echo "env=sandbox" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # next build on the sandbox box often exceeds the 10m default
          command_timeout: 30m
          script: |
            cd "${{ steps.config.outputs.path }}"
            bash deploy.sh "${{ github.ref_name }}"

      - name: Summary
        run: echo "Deployed *${{ steps.config.outputs.env }}* from branch ${{ github.ref_name }}"
